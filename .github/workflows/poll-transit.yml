name: Poll GoCary Transit

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: poll-transit
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Poll feeds
        run: python scripts/poll_transit.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Poll transit feeds $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 5 + 1))
          done
          # Every poll's data is superseded by the next one under a minute
          # later, so a genuine content conflict here (two runs' rewrites of
          # the same live-data files landing at nearly the same time,
          # something a plain rebase can't reconcile) means dropping this
          # one snapshot is the safe, self-healing outcome -- not a failure
          # worth alerting on. Surface it as a visible annotation instead of
          # a red X so a *pattern* of these would still be noticeable.
          echo "::warning::Could not publish this poll after 5 attempts (real content conflict, not a simple race) -- dropping this snapshot; the next poll will supersede it."
          git rebase --abort 2>/dev/null || true
          exit 0
